[package]
name = "agent-session-manager"
version = "0.1.34"
description = "多 CLI Agent 会话管理 GUI（Qoder / Claude Code / Codex / OpenCode / Pi）"
authors = ["Agent Session Manager contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_session_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.9"
jsonc-parser = { version = "0.34", features = ["serde"] }
sha2 = "0.10"
dirs = "6"
trash = "5"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8.2.0"
chrono = "0.4.45"
zstd = "0.13"
memchr = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }

[dev-dependencies]
tempfile = "3"
